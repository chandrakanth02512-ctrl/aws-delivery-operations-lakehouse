AWSTemplateFormatVersion: '2010-09-09'
Description: Delivery lakehouse Phase 1 definitions only; existing S3 bucket and bootstrap IAM roles.
Parameters:
  ExistingBucket:
    Type: String
    Default: ck-delivery-ops-lakehouse-2026-1025
    AllowedValues: [ck-delivery-ops-lakehouse-2026-1025]
  ArtifactRevision:
    Type: String
    AllowedPattern: '^[a-f0-9]{40}$'
    Description: Reviewed Git commit SHA used as immutable artifact prefix.
Rules:
  SydneyOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-southeast-2]
        AssertDescription: Deploy only in Sydney.
Resources:
  SilverDatabase:
    Type: AWS::Glue::Database
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: delivery_ops_dev_silver
        Description: Validated synthetic delivery snapshots; Iceberg format v2.
        LocationUri: !Sub 's3://${ExistingBucket}/silver/tables/'
  GoldDatabase:
    Type: AWS::Glue::Database
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: delivery_ops_dev_gold
        Description: Delivery star schema and daily operational KPIs; Iceberg format v2.
        LocationUri: !Sub 's3://${ExistingBucket}/gold/tables/'
  GlueErrorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws-glue/jobs/delivery-ops-dev/error
      RetentionInDays: 7
  GlueOutputLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws-glue/jobs/delivery-ops-dev/output
      RetentionInDays: 7
  Phase1Job:
    Type: AWS::Glue::Job
    DependsOn: [SilverDatabase, GoldDatabase, GlueErrorLogs, GlueOutputLogs]
    Properties:
      Name: delivery-ops-dev-phase1
      Description: Manually invoked full snapshot pipeline; never scheduled in Phase 1.
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/delivery-ops-dev-glue-runtime'
      GlueVersion: '6.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 15
      MaxRetries: 0
      ExecutionClass: STANDARD
      ExecutionProperty: {MaxConcurrentRuns: 1}
      JobRunQueuingEnabled: false
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${ExistingBucket}/landing/_artifacts/${ArtifactRevision}/phase1.py'
      DefaultArguments:
        '--job-language': python
        '--job-bookmark-option': job-bookmark-disable
        '--enable-auto-scaling': 'false'
        '--datalake-formats': iceberg
        '--extra-py-files': !Sub 's3://${ExistingBucket}/landing/_artifacts/${ArtifactRevision}/delivery_lakehouse.zip'
        '--TempDir': !Sub 's3://${ExistingBucket}/bronze/_tmp/'
        '--custom-logGroup-prefix': /aws-glue/jobs/delivery-ops-dev
        '--bucket': !Ref ExistingBucket
        '--region': !Ref AWS::Region
        '--database_prefix': delivery_ops_dev
        '--max_reject_fraction': '0.15'
        '--conf': !Sub >-
          spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://${ExistingBucket}/silver/
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.session.timeZone=UTC
          --conf spark.sql.ansi.enabled=true
          --conf spark.sql.shuffle.partitions=8
          --conf spark.sql.adaptive.enabled=true
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: delivery-ops-dev
      Description: Manual portfolio queries with enforced output and a 10 MiB per-query scan cap.
      State: ENABLED
      RecursiveDeleteOption: false
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: false
        BytesScannedCutoffPerQuery: 10485760
        EngineVersion: {SelectedEngineVersion: Athena engine version 3}
        ResultConfiguration:
          OutputLocation: !Sub 's3://${ExistingBucket}/athena-results/'
          ExpectedBucketOwner: !Ref AWS::AccountId
          EncryptionConfiguration: {EncryptionOption: SSE_S3}
Outputs:
  JobName:
    Value: !Ref Phase1Job
  GoldDatabaseName:
    Value: !Ref GoldDatabase
  Workgroup:
    Value: !Ref AthenaWorkgroup
