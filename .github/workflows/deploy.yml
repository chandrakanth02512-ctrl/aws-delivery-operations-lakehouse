name: Reviewed AWS infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      approval:
        description: Type DEPLOY_REVIEWED_INFRASTRUCTURE after reviewing bootstrap IAM and cost limits.
        type: string
        required: true
      change_set:
        description: For apply, paste the change-set name from the reviewed plan on this same main commit.
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: delivery-ops-dev-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'chandrakanth02512-ctrl/aws-delivery-operations-lakehouse' &&
      vars.AWS_DEPLOYMENT_APPROVED == 'true' &&
      inputs.approval == 'DEPLOY_REVIEWED_INFRASTRUCTURE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install locked tools and validate templates
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen
          uv run ruff check .
          uv run cfn-lint infrastructure/*.yaml
          uv run python scripts/package_glue.py
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-duration-seconds: 1800
          role-session-name: delivery-ops-${{ github.run_id }}
      - name: Plan or apply reviewed change set (never starts jobs)
        env:
          DEPLOY_OPERATION: ${{ inputs.operation }}
          REVIEWED_CHANGE_SET: ${{ inputs.change_set }}
          CFN_ROLE_ARN: ${{ vars.AWS_CFN_ROLE_ARN }}
        run: >-
          uv run python scripts/deploy.py
          --operation "$DEPLOY_OPERATION"
          --revision "$GITHUB_SHA"
          --service-role "$CFN_ROLE_ARN"
          --change-set "$REVIEWED_CHANGE_SET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: infrastructure-review-${{ github.run_id }}
          path: artifacts/change-set.json
          if-no-files-found: ignore
          retention-days: 7
