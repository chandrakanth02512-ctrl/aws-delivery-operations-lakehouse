name: Lakehouse quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/phase-1-lakehouse', 'feat/phase-2-incremental-cdc']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.4
          uv sync --frozen --extra spark
          uv pip check
      - name: Lint and infrastructure validation
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run cfn-lint infrastructure/*.yaml
          uv run python scripts/data_dictionary.py --check
      - name: Fetch pinned local Iceberg runtime
        run: uv run python scripts/fetch_iceberg.py
      - name: Unit, Spark and local Iceberg integration tests
        env:
          ICEBERG_SPARK_JAR: artifacts/iceberg-spark-runtime-4.1_2.13-1.11.0.jar
        run: uv run pytest --cov=delivery_lakehouse --cov-report=term-missing --cov-report=json:artifacts/coverage.json --junitxml=artifacts/pytest.xml
      - name: Build Glue import package
        run: |
          uv build
          uv run python scripts/package_glue.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lakehouse-verification
          path: |
            artifacts/pytest.xml
            artifacts/coverage.json
            dist/delivery_lakehouse.zip
          retention-days: 7
